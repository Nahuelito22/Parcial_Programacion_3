        :root {

        body {

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Animación sutil para el gradiente del login */
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .animate-shimmer {
            background-size: 200% 200%;
            animation: shimmer 6s ease-in-out infinite;
        }

        /* Efecto de pulso para el indicador online */
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        .pulse-ring::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #10b981;
            animation: pulse-ring 2s ease-out infinite;
            z-index: -1;
        }

        /* Transiciones suaves entre vistas */
        .view-enter {
            animation: fadeSlideIn 0.35s ease-out forwards;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar estilizado */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }

            background: #1e293b;
            border-radius: 3px;
        }

        }

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>

    function Toast({ message, type, isVisible }) {
        if (!isVisible) return null;
        const bgColor = type === 'success' ? 'bg-emerald-500/90' : type === 'error' ? 'bg-red-500/90' : 'bg-gray-700/90';
        return (
            <div className={`fixed top-6 right-6 z-50 ${bgColor} backdrop-blur-md text-white px-5 py-3 rounded-xl shadow-lg view-enter flex items-center gap-3 text-sm font-medium`}>
                {type === 'success' && <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20,6 9,17 4,12"/></svg>}
                {type === 'error' && <Icon.AlertTriangle className="w-5 h-5" />}
                {message}
            </div>
        );
    }

<thead>
<tr className="border-b border-gray-800/60 bg-pitch-800/30">
<th className="text-left py-4 px-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">Jugador</th>
<th className="text-left py-4 px-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">País</th>
<th className="text-center py-4 px-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">Goles</th>
<th className="text-center py-4 px-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">Asistencias</th>
<th className="text-center py-4 px-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">Mundiales</th>
<th className="text-right py-4 px-5 text-xs font-semibold text-gray-400 uppercase tracking-wider">Acciones</th>
</tr>
</thead>
<tbody>
{filteredPlayers.map((player) => (
<tr key={player.id} className="border-b border-gray-800/40 table-row-hover">
{/* Jugador con avatar */}
<td className="py-3.5 px-5">
<div className="flex items-center gap-3">
<div
className="w-9 h-9 rounded-full flex items-center justify-center text-white font-semibold text-xs flex-shrink-0 shadow-sm"
style={{ background: `linear-gradient(135deg, ${player.color}, ${player.color}88)` }}
>
{player.name.split(' ').map(n => n[0]).join('').slice(0, 2)}
</div>
<div>
<p className="text-sm font-semibold text-white">{player.name}</p>
</div>
</div>
</td>
{/* País con bandera */}
<td className="py-3.5 px-5">
<div className="flex items-center gap-2">
<span className="text-lg">{player.flag}</span>
<span className="text-sm text-gray-300">{player.country}</span>
</div>
</td>
{/* Goles */}
<td className="py-3.5 px-5 text-center">
<span className="inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded-lg bg-gold-500/10 text-gold-400 font-display font-bold text-sm">
{player.goals}
</span>
</td>
{/* Asistencias */}
<td className="py-3.5 px-5 text-center">
<span className="inline-flex items-center justify-center min-w-[2rem] px-2 py-1 rounded-lg bg-blue-500/10 text-blue-400 font-display font-bold text-sm">
{player.assists}
</span>
</td>
{/* Mundiales */}
<td className="py-3.5 px-5 text-center">
<span className="text-sm text-gray-300 font-medium">{player.worldCups}</span>
</td>
{/* Acciones */}
<td className="py-3.5 px-5 text-right">
<div className="flex items-center justify-end gap-1.5">
<button
onClick={() => handleEdit(player)}
className="p-2 rounded-lg text-gray-400 hover:text-emerald-400 hover:bg-emerald-500/10 transition-all"
title="Editar"
>
<Icon.Edit className="w-4 h-4" />
</button>
<button
onClick={() => handleDelete(player)}
className="p-2 rounded-lg text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition-all"
title="Eliminar"
>
<Icon.Trash2 className="w-4 h-4" />
</button>
</div>
</td>
</tr>
))}
</tbody>
</table>
</div>

{/* Footer de la tabla */}
<div className="flex items-center justify-between px-5 py-4 border-t border-gray-800/60">
<p className="text-sm text-gray-500">Mostrando {filteredPlayers.length} de {mockPlayers.length} jugadores</p>
<div className="flex items-center gap-2">
<button className="p-2 rounded-lg bg-pitch-800/50 text-gray-500 border border-gray-700/30 cursor-not-allowed opacity-50">
<svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15,18 9,12 15,6"/></svg>
</button>
<span className="text-sm text-gray-300 font-medium px-3">Página 1</span>
<button className="p-2 rounded-lg bg-pitch-800/50 text-gray-400 border border-gray-700/30 hover:border-gray-600 hover:text-gray-200 transition-all">
<svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9,18 15,12 9,6"/></svg>
</button>
</div>
</div>
</div>

{/* Modal de confirmación */}
<ConfirmModal
isOpen={deleteTarget !== null}
onClose={() => setDeleteTarget(null)}
onConfirm={confirmDelete}
playerName={deleteTarget?.name || ''}
/>

{/* Toast */}
<Toast message={toast.message} type={toast.type} isVisible={toast.visible} />
</div>
);
}

// ============================================================
// COMPONENTE PRINCIPAL: APP
// ============================================================
function App() {
const [isLoggedIn, setIsLoggedIn] = React.useState(false);
const [currentView, setCurrentView] = React.useState('dashboard');

const handleLogin = () => {
setIsLoggedIn(true);
setCurrentView('dashboard');
};

const handleLogout = () => {
setIsLoggedIn(false);
setCurrentView('dashboard');
};

const handleNavigate = (viewId) => {
setCurrentView(viewId);
};

// Si no está logueado, mostrar Login
if (!isLoggedIn) {
return <LoginScreen onLogin={handleLogin} />;
}

// Layout principal con Sidebar
return (
<div className="flex h-screen overflow-hidden bg-pitch-950">
<Sidebar
currentView={currentView}
onNavigate={handleNavigate}
onLogout={handleLogout}
/>
{/* Contenido principal */}
<main className="flex-1 overflow-y-auto p-6 lg:p-8">
{currentView === 'dashboard' && <DashboardView />}
{currentView === 'admin' && <AdminPanelView />}
{currentView === 'stats' && (
<div className="view-enter flex items-center justify-center h-full">
<div className="text-center">
<div className="w-20 h-20 rounded-full bg-pitch-800/50 border border-gray-700/30 flex items-center justify-center mx-auto mb-4">
<Icon.BarChart3 className="w-10 h-10 text-gray-500" />
</div>
<h3 className="text-xl font-display font-bold text-white mb-2">Estadísticas Avanzadas</h3>
<p className="text-gray-400 text-sm max-w-md">Sección en desarrollo. Aquí podrás explorar gráficos interactivos y comparativas detalladas.</p>
</div>
</div>
)}
{currentView === 'settings' && (
<div className="view-enter flex items-center justify-center h-full">
<div className="text-center">
<div className="w-20 h-20 rounded-full bg-pitch-800/50 border border-gray-700/30 flex items-center justify-center mx-auto mb-4">
<Icon.Settings className="w-10 h-10 text-gray-500" />
</div>
<h3 className="text-xl font-display font-bold text-white mb-2">Configuración</h3>
<p className="text-gray-400 text-sm max-w-md">Panel de configuración en desarrollo. Personaliza tu experiencia aquí.</p>
</div>
</div>
)}
</main>
</div>
);
}

// ============================================================
// RENDER
// ============================================================
const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);
</script>
</body>
</html>
