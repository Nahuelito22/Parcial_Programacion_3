      ::-webkit-scrollbar { width:5px; }
      ::-webkit-scrollbar-track { background:#0b1120; }
      ::-webkit-scrollbar-thumb { background:#1e293b; border-radius:3px; }
      ::-webkit-scrollbar-thumb:hover { background:#334155; }

      @keyframes fadeUp   { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
      @keyframes fadeIn   { from{opacity:0} to{opacity:1} }
      @keyframes slideL   { from{opacity:0;transform:translateX(-24px)} to{opacity:1;transform:translateX(0)} }
      @keyframes scaleIn  { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:scale(1)} }

      @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

      .a-fi  { animation:fadeIn .5s ease both; }

      .d4{animation-delay:.32s} .d5{animation-delay:.40s} .d6{animation-delay:.48s} .d7{animation-delay:.56s}

                  <td className="px-5 py-3.5">
                    <div className="flex items-center justify-center gap-1.5">
                      <button className="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 flex items-center justify-center transition-colors" title="Editar">{icon(I.Edit,14,14)}</button>
                      <button className="w-8 h-8 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 flex items-center justify-center transition-colors" title="Eliminar">{icon(I.Trash,14,14)}</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {/* Pagination */}
        <div className="flex items-center justify-between px-5 py-3.5 border-t border-slate-800/40">
          <span className="text-xs text-slate-600">Mostrando {filtered.length} de {players.length} jugadores</span>
          <div className="flex items-center gap-1">
            {[1,2,3].map(n=>(
              <button key={n} className={`w-8 h-8 rounded-lg text-xs font-semibold transition-colors ${n===1?'bg-gold-500/15 text-gold-400 border border-gold-500/25':'text-slate-600 hover:text-white hover:bg-slate-800/40'}`}>{n}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

/* ─────────────── MATCHES PLACEHOLDER ─────────────── */
const MatchesView = () => (
  <div className="space-y-6 a-fu">
    <div>
      <h1 className="font-display text-[1.85rem] font-bold text-white">Partidos</h1>
      <p className="text-slate-500 text-sm mt-0.5">Historial completo de encuentros mundialistas</p>
    </div>
    <div className="grid gap-4">
      {wcList.map((w,i)=>(
        <div key={w.year} className={`bg-[#131b2e] border border-slate-800/40 rounded-2xl p-5 flex items-center justify-between hover:border-slate-700/50 transition-all a-fu d${i+1}`}>
          <div className="flex items-center gap-5">
            <div className="w-14 h-14 rounded-xl bg-gold-500/10 flex items-center justify-center">
              <span className="font-display text-lg font-bold text-gold-400">{w.year}</span>
            </div>
            <div>
              <div className="text-sm font-semibold text-white">🏆 {w.champion}</div>
              <div className="text-xs text-slate-500 mt-0.5">Finalista: {w.runnerUp}</div>
            </div>
          </div>
          <div className="text-right">
            <div className="font-display text-xl font-bold text-white">{w.goals}</div>
            <div className="text-[11px] text-slate-600">goles en el torneo</div>
          </div>
        </div>
      ))}
    </div>
  </div>
);

/* ─────────────── STATS PLACEHOLDER ─────────────── */
const StatsView = () => (
  <div className="space-y-6 a-fu">
    <div>
      <h1 className="font-display text-[1.85rem] font-bold text-white">Estadísticas</h1>
      <p className="text-slate-500 text-sm mt-0.5">Datos históricos y récords mundiales</p>
    </div>
    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      {[
        { title:'Máximo Goleador', value:'Miroslav Klose', detail:'16 goles en 4 mundiales', emoji:'🥇' },
        { title:'Más Asistencias', value:'Pelé', detail:'10 asistencias', emoji:'🎯' },
        { title:'Más Participaciones', value:'Antonio Carbajal & Lothar Matthäus', detail:'5 mundiales', emoji:'🔄' },
        { title:'Goleador en un Torneo', value:'Just Fontaine', detail:'13 goles (Suecia 1958)', emoji:'⚡' },
        { title:'Portero menos Vencido', value:'Fabien Barthez', detail:'630 min sin recibir gol (1998)', emoji:'🧤' },
        { title:'Final más Emocionante', value:'Argentina 3-3 Francia', detail:'Qatar 2022 — (4-2 pen.)', emoji:'🔥' },
      ].map((r,i)=>(
        <div key={i} className={`bg-[#131b2e] border border-slate-800/40 rounded-2xl p-5 hover:border-gold-500/20 transition-all hover:-translate-y-0.5 a-fu d${i+1}`}>
          <div className="text-2xl mb-3">{r.emoji}</div>
          <div className="text-xs text-slate-500 uppercase tracking-wider mb-1">{r.title}</div>
          <div className="font-display text-lg font-bold text-white">{r.value}</div>
          <div className="text-xs text-slate-500 mt-1">{r.detail}</div>
        </div>
      ))}
    </div>
  </div>
);

/* ─────────────── PLAYERS PLACEHOLDER ─────────────── */
const PlayersView = () => (
  <div className="space-y-6 a-fu">
    <div>
      <h1 className="font-display text-[1.85rem] font-bold text-white">Jugadores</h1>
      <p className="text-slate-500 text-sm mt-0.5">Explora las leyendas del fútbol mundial</p>
    </div>
    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
      {players.slice(0,8).map((p,i)=>{
        const initials = p.name.split(' ').map(w=>w[0]).slice(0,2).join('');
        return (
          <div key={p.id} className={`bg-[#131b2e] border border-slate-800/40 rounded-2xl p-5 text-center hover:border-gold-500/20 transition-all hover:-translate-y-1 a-fu d${i+1}`}>
            <div className="w-16 h-16 rounded-full bg-gradient-to-br from-slate-600 to-slate-700 flex items-center justify-center text-lg font-bold text-white mx-auto mb-3 border-2 border-slate-600/40">{initials}</div>
            <div className="text-sm font-semibold text-white">{p.name}</div>
            <div className="text-xs text-slate-500 mt-0.5">{p.flag} {p.country}</div>
            <div className="flex items-center justify-center gap-4 mt-3 pt-3 border-t border-slate-800/40">
              <div><div className="font-display text-lg font-bold text-gold-400">{p.goals}</div><div className="text-[10px] text-slate-600 uppercase">Goles</div></div>
              <div className="w-px h-8 bg-slate-800"/>
              <div><div className="font-display text-lg font-bold text-blue-400">{p.assists}</div><div className="text-[10px] text-slate-600 uppercase">Asist.</div></div>
              <div className="w-px h-8 bg-slate-800"/>
              <div><div className="font-display text-lg font-bold text-white">{p.rating}</div><div className="text-[10px] text-slate-600 uppercase">Rating</div></div>
            </div>
          </div>
        );
      })}
    </div>
  </div>
);

/* ─────────────── APP SHELL ─────────────── */

const App = () => {
  const [loggedIn,setLoggedIn] = useState(false);
  const [view,setView]         = useState('dashboard');

  if(!loggedIn) return <LoginPage onLogin={()=>setLoggedIn(true)}/>;

  return (
    <div className="flex min-h-screen bg-navy-950">
      <Sidebar active={view} setActive={setView} onLogout={()=>setLoggedIn(false)}/>
      <main className="flex-1 ml-64 p-7">
        <TopBar/>
        {view==='dashboard' && <DashboardView/>}
        {view==='admin'     && <AdminView/>}
        {view==='players'   && <PlayersView/>}
        {view==='matches'   && <MatchesView/>}
        {view==='stats'     && <StatsView/>}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
