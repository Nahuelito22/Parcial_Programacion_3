<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Stats - Kimi Premium Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {}
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-200">
    <div id="root"></div>

    <!-- React + ReactDOM + Babel + Recharts Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const {
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell
        } = Recharts;

        const { motion, AnimatePresence } = window.Motion || window.framerMotion || {
            motion: {
                div: React.forwardRef((props, ref) => <div ref={ref} {...props} />),
                tr: React.forwardRef((props, ref) => <tr ref={ref} {...props} />),
            },
            AnimatePresence: React.Fragment
        };

        const createLucideIcon = (iconName) => {
            return (props) => {
                const ref = React.useRef(null);
                React.useEffect(() => {
                    if (ref.current && window.lucide) {
                        ref.current.innerHTML = "";
                        const iconObj = window.lucide.icons[iconName];
                        if (iconObj) {
                            const svg = window.lucide.createElement(iconObj);
                            if (props.size) {
                                svg.setAttribute("width", props.size);
                                svg.setAttribute("height", props.size);
                            }
                            if (props.className) {
                                svg.setAttribute("class", props.className);
                            }
                            ref.current.appendChild(svg);
                        }
                    }
                }, [props.size, props.className]);
                return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} />;
            };
        };

        const Trophy = createLucideIcon('Trophy');
        const Users = createLucideIcon('Users');
        const Activity = createLucideIcon('Activity');
        const Globe = createLucideIcon('Globe');
        const Search = createLucideIcon('Search');
        const Edit3 = createLucideIcon('Edit3');
        const Trash2 = createLucideIcon('Trash2');
        const LogOut = createLucideIcon('LogOut');
        const ChevronRight = createLucideIcon('ChevronRight');
        const Menu = createLucideIcon('Menu');
        const X = createLucideIcon('X');
        const TrendingUp = createLucideIcon('TrendingUp');
        const Shield = createLucideIcon('Shield');
        const Swords = createLucideIcon('Swords');

        // --- MOCK DATA ---

        const MOCK_STATS = [
          { id: 1, title: "Goleador Histórico", value: "K. Mbappé", sub: "12 Goles", icon: Trophy, color: "text-amber-400", bg: "bg-amber-400/10" },
          { id: 2, title: "Campeón Actual", value: "Argentina", sub: "3 Títulos", icon: Globe, color: "text-sky-400", bg: "bg-sky-400/10" },
          { id: 3, title: "Partidos Jugados", value: "64", sub: "Temporada 2022", icon: Activity, color: "text-emerald-400", bg: "bg-emerald-400/10" },
          { id: 4, title: "Asistencias", value: "L. Messi", sub: "8 Asistencias", icon: Users, color: "text-violet-400", bg: "bg-violet-400/10" },
        ];

        const CHART_DATA = [
          { name: '2018', Messi: 4, Mbappe: 3 },
          { name: '2019', Messi: 6, Mbappe: 5 },
          { name: '2020', Messi: 5, Mbappe: 7 },
          { name: '2021', Messi: 8, Mbappe: 6 },
          { name: '2022', Messi: 13, Mbappe: 12 },
          { name: '2023', Messi: 4, Mbappe: 9 },
        ];

        const PLAYERS_DATA = [
          { id: 1, name: "Lionel Messi", country: "Argentina", goals: 13, assists: 8, matches: 26, status: "Activo" },
          { id: 2, name: "Kylian Mbappé", country: "Francia", goals: 12, assists: 4, matches: 14, status: "Activo" },
          { id: 3, name: "Julián Álvarez", country: "Argentina", goals: 4, assists: 1, matches: 7, status: "Activo" },
          { id: 4, name: "Olivier Giroud", country: "Francia", goals: 4, assists: 0, matches: 8, status: "Retirado" },
          { id: 5, name: "Enzo Fernández", country: "Argentina", goals: 1, assists: 1, matches: 7, status: "Activo" },
        ];

        // --- COMPONENTS ---

        const Card = ({ children, className = "" }) => (
          <div className={`bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 shadow-xl ${className}`}>
            {children}
          </div>
        );

        const Badge = ({ children, type = "default" }) => {
          const styles = {
            default: "bg-slate-800 text-slate-300",
            success: "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20",
            warning: "bg-amber-500/10 text-amber-400 border border-amber-500/20",
            danger: "bg-rose-500/10 text-rose-400 border border-rose-500/20",
          };
          return (
            <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium ${styles[type] || styles.default}`}>
              {children}
            </span>
          );
        };

        // 1. LOGIN SCREEN
        const LoginScreen = ({ onLogin }) => {
          return (
            <div className="min-h-screen flex items-center justify-center bg-slate-950 relative overflow-hidden">
              {/* Abstract Background */}
              <div className="absolute inset-0 z-0">
                <div className="absolute top-0 left-0 w-full h-full bg-[url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center opacity-20 blur-sm" />
                <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent" />
                <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/20 rounded-full blur-[100px] animate-pulse" />
                <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-500/20 rounded-full blur-[100px]" />
              </div>

              <motion.div 
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: 0.6 }}
                className="relative z-10 w-full max-w-md p-8"
              >
                <div className="text-center mb-10">
                  <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 mb-6">
                    <Trophy className="w-8 h-8 text-emerald-400" />
                  </div>
                  <h1 className="text-3xl font-bold text-white tracking-tight mb-2">World Cup Stats</h1>
                  <p className="text-slate-400">Panel de Control Premium</p>
                </div>

                <Card className="border-slate-700/50 bg-slate-900/80">
                  <form onSubmit={(e) => { e.preventDefault(); onLogin(); }} className="space-y-6">
                    <div>
                      <label className="block text-sm font-medium text-slate-400 mb-2">Correo Electrónico</label>
                      <div className="relative">
                        <input 
                          type="email" 
                          defaultValue="admin@fifa.com"
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-400 mb-2">Contraseña</label>
                      <div className="relative">
                        <input 
                          type="password" 
                          defaultValue="password123"
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all"
                        />
                      </div>
                    </div>
                    
                    <div className="flex items-center justify-between text-sm">
                      <label className="flex items-center text-slate-400 cursor-pointer hover:text-white transition-colors">
                        <input type="checkbox" className="mr-2 rounded border-slate-700 bg-slate-800 text-emerald-500 focus:ring-emerald-500/50" />
                        Recordarme
                      </label>
                      <a href="#" className="text-emerald-400 hover:text-emerald-300 transition-colors">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button 
                      type="submit"
                      className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition-all transform active:scale-[0.98] shadow-lg shadow-emerald-500/20"
                    >
                      Iniciar Sesión
                    </button>
                  </form>
                </Card>
                
                <p className="text-center text-slate-500 text-sm mt-8">
                  © 2026 FIFA World Cup. Todos los derechos reservados.
                </p>
              </motion.div>
            </div>
          );
        };

        // 2. DASHBOARD SCREEN
        const DashboardScreen = () => {
          return (
            <div className="p-6 md:p-8 space-y-8 max-w-7xl mx-auto">
              {/* Header */}
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h1 className="text-3xl font-bold text-white">Dashboard</h1>
                  <p className="text-slate-400 mt-1">Resumen de rendimiento global</p>
                </div>
                <div className="flex items-center gap-3">
                  <span className="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-sm font-medium border border-emerald-500/20 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                    En Vivo
                  </span>
                  <span className="text-slate-500 text-sm">Actualizado: Hace 2 min</span>
                </div>
              </div>

              {/* Stats Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                {MOCK_STATS.map((stat, index) => (
                  <motion.div
                    key={stat.id}
                    initial={{ opacity: 0, y: 20 }}
                    animate={{ opacity: 1, y: 0 }}
                    transition={{ delay: index * 0.1 }}
                  >
                    <Card className="hover:border-slate-700 transition-colors group cursor-pointer">
                      <div className="flex items-start justify-between mb-4">
                        <div className={`p-3 rounded-xl ${stat.bg} ${stat.color}`}>
                          <stat.icon size={24} />
                        </div>
                        <ChevronRight className="text-slate-600 group-hover:text-white transition-colors" size={20} />
                      </div>
                      <h3 className="text-slate-400 text-sm font-medium mb-1">{stat.title}</h3>
                      <div className="text-2xl font-bold text-white mb-1">{stat.value}</div>
                      <div className="text-xs text-slate-500">{stat.sub}</div>
                    </Card>
                  </motion.div>
                ))}
              </div>

              {/* Main Chart Section */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <motion.div 
                  className="lg:col-span-2"
                  initial={{ opacity: 0, scale: 0.95 }}
                  animate={{ opacity: 1, scale: 1 }}
                  transition={{ delay: 0.4 }}
                >
                  <Card className="h-full">
                    <div className="flex items-center justify-between mb-8">
                      <div>
                        <h2 className="text-xl font-bold text-white flex items-center gap-2">
                          <TrendingUp className="text-emerald-400" size={20} />
                          Comparativa de Goles
                        </h2>
                        <p className="text-slate-400 text-sm mt-1">Messi vs Mbappé (Últimos 5 años)</p>
                      </div>
                      <div className="flex gap-4 text-sm">
                        <div className="flex items-center gap-2">
                          <span className="w-3 h-3 rounded-full bg-emerald-500" />
                          <span className="text-slate-300">Messi</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="w-3 h-3 rounded-full bg-blue-500" />
                          <span className="text-slate-300">Mbappé</span>
                        </div>
                      </div>
                    </div>
                    
                    <div className="h-[350px] w-full">
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={CHART_DATA} barGap={8}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                          <XAxis 
                            dataKey="name" 
                            stroke="#94a3b8" 
                            tick={{ fill: '#94a3b8' }} 
                            axisLine={false}
                            tickLine={false}
                          />
                          <YAxis 
                            stroke="#94a3b8" 
                            tick={{ fill: '#94a3b8' }} 
                            axisLine={false}
                            tickLine={false}
                          />
                          <Tooltip 
                            contentStyle={{ 
                              backgroundColor: '#0f172a', 
                              border: '1px solid #1e293b',
                              borderRadius: '12px',
                              color: '#fff'
                            }}
                            cursor={{ fill: '#1e293b', opacity: 0.4 }}
                          />
                          <Bar dataKey="Messi" fill="#10b981" radius={[4, 4, 0, 0]} />
                          <Bar dataKey="Mbappe" fill="#3b82f6" radius={[4, 4, 0, 0]} />
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  </Card>
                </motion.div>

                <motion.div
                   initial={{ opacity: 0, x: 20 }}
                   animate={{ opacity: 1, x: 0 }}
                   transition={{ delay: 0.5 }}
                >
                  <Card className="h-full flex flex-col">
                    <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2">
                      <Swords className="text-amber-400" size={20} />
                      Próximos Encuentros
                    </h2>
                    <div className="space-y-4 flex-1">
                      {[1, 2, 3].map((match) => (
                        <div key={match} className="bg-slate-950/50 rounded-xl p-4 border border-slate-800 hover:border-slate-700 transition-colors">
                          <div className="flex justify-between items-center mb-3">
                            <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Grupo C</span>
                            <span className="text-xs text-emerald-400">Mañana, 16:00</span>
                          </div>
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                              <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold">ARG</div>
                              <span className="font-medium text-white">Argentina</span>
                            </div>
                            <span className="text-slate-500 font-bold">VS</span>
                            <div className="flex items-center gap-3">
                              <span className="font-medium text-white">México</span>
                              <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold">MEX</div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <button className="w-full mt-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium transition-colors">
                      Ver Calendario Completo
                    </button>
                  </Card>
                </motion.div>
              </div>
            </div>
          );
        };

        // 3. ADMIN PANEL (CRUD)
        const AdminPanel = () => {
          const [search, setSearch] = useState("");

          return (
            <div className="p-6 md:p-8 max-w-7xl mx-auto space-y-8">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h1 className="text-3xl font-bold text-white">Gestión de Jugadores</h1>
                  <p className="text-slate-400 mt-1">Administra las estadísticas del torneo</p>
                </div>
                <button className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-3 rounded-xl transition-all shadow-lg shadow-emerald-500/20 flex items-center gap-2">
                  <Users size={18} />
                  Nuevo Jugador
                </button>
              </div>

              <Card className="overflow-hidden p-0">
                {/* Toolbar */}
                <div className="p-6 border-b border-slate-800 flex flex-col sm:flex-row gap-4 justify-between items-center bg-slate-900/50">
                  <div className="relative w-full sm:w-96">
                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" size={18} />
                    <input 
                      type="text" 
                      placeholder="Buscar jugador..."
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-white focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 transition-all"
                    />
                  </div>
                  <div className="flex gap-2">
                    <select className="bg-slate-950 border border-slate-800 text-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500/50">
                      <option>Todos los Países</option>
                      <option>Argentina</option>
                      <option>Francia</option>
                    </select>
                  </div>
                </div>

                {/* Table */}
                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead>
                      <tr className="bg-slate-950/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                        <th className="px-6 py-4 font-medium">Jugador</th>
                        <th className="px-6 py-4 font-medium">País</th>
                        <th className="px-6 py-4 font-medium text-center">Goles</th>
                        <th className="px-6 py-4 font-medium text-center">Asist.</th>
                        <th className="px-6 py-4 font-medium text-center">Part.</th>
                        <th className="px-6 py-4 font-medium text-center">Estado</th>
                        <th className="px-6 py-4 font-medium text-right">Acciones</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/50">
                      {PLAYERS_DATA.map((player) => (
                        <motion.tr 
                          key={player.id}
                          initial={{ opacity: 0 }}
                          animate={{ opacity: 1 }}
                          className="hover:bg-slate-800/30 transition-colors group"
                        >
                          <td className="px-6 py-4">
                            <div className="flex items-center gap-4">
                              <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-lg">
                                👤
                              </div>
                              <div>
                                <div className="font-medium text-white">{player.name}</div>
                                <div className="text-xs text-slate-500">ID: #{player.id}</div>
                              </div>
                            </div>
                          </td>
                          <td className="px-6 py-4">
                            <div className="flex items-center gap-2">
                              <span className="text-lg">{player.country === 'Argentina' ? '🇦🇷' : '🇫🇷'}</span>
                              <span className="text-slate-300">{player.country}</span>
                            </div>
                          </td>
                          <td className="px-6 py-4 text-center">
                            <span className="font-bold text-white">{player.goals}</span>
                          </td>
                          <td className="px-6 py-4 text-center text-slate-300">
                            {player.assists}
                          </td>
                          <td className="px-6 py-4 text-center text-slate-300">
                            {player.matches}
                          </td>
                          <td className="px-6 py-4 text-center">
                            <Badge type={player.status === 'Activo' ? 'success' : 'warning'}>
                              {player.status}
                            </Badge>
                          </td>
                          <td className="px-6 py-4 text-right">
                            <div className="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                              <button className="p-2 rounded-lg bg-slate-800 hover:bg-blue-500/20 hover:text-blue-400 text-slate-400 transition-all">
                                <Edit3 size={16} />
                              </button>
                              <button className="p-2 rounded-lg bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 transition-all">
                                <Trash2 size={16} />
                              </button>
                            </div>
                          </td>
                        </motion.tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                
                {/* Pagination */}
                <div className="p-4 border-t border-slate-800 flex items-center justify-between text-sm text-slate-400">
                  <span>Mostrando 5 de 64 resultados</span>
                  <div className="flex gap-2">
                    <button className="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-white disabled:opacity-50" disabled>Anterior</button>
                    <button className="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-white">Siguiente</button>
                  </div>
                </div>
              </Card>
            </div>
          );
        };

        // --- LAYOUT WRAPPER ---

        const SidebarItem = ({ icon: Icon, label, active, onClick }) => (
          <button
            onClick={onClick}
            className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 group ${
              active 
                ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'
            }`}
          >
            <Icon size={20} className={active ? "text-emerald-400" : "text-slate-500 group-hover:text-white"} />
            <span className="font-medium">{label}</span>
            {active && <motion.div layoutId="active-pill" className="ml-auto w-1.5 h-1.5 rounded-full bg-emerald-400" />}
          </button>
        );

        function App() {
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [activeTab, setActiveTab] = useState('dashboard');
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

          if (!isLoggedIn) {
            return <LoginScreen onLogin={() => setIsLoggedIn(true)} />;
          }

          return (
            <div className="min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-emerald-500/30">
              {/* Mobile Header */}
              <div className="lg:hidden flex items-center justify-between p-4 bg-slate-900/50 border-b border-slate-800 backdrop-blur-md sticky top-0 z-50">
                <div className="flex items-center gap-2 font-bold text-white text-xl">
                  <Trophy className="text-emerald-400" />
                  WC Stats
                </div>
                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-slate-300">
                  {isMobileMenuOpen ? <X /> : <Menu />}
                </button>
              </div>

              <div className="flex">
                {/* Sidebar */}
                <aside className={`
                  fixed lg:sticky top-0 left-0 z-40 h-screen w-72 bg-slate-900 border-r border-slate-800 transform transition-transform duration-300 lg:translate-x-0
                  ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}
                `}>
                  <div className="p-6 h-full flex flex-col">
                    <div className="flex items-center gap-3 mb-10 px-2">
                      <div className="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                        <Trophy className="text-slate-950" size={24} />
                      </div>
                      <div>
                        <h1 className="text-xl font-bold text-white tracking-tight">WC Stats</h1>
                        <p className="text-xs text-emerald-400 font-medium">Premium Edition</p>
                      </div>
                    </div>

                    <nav className="space-y-2 flex-1">
                      <SidebarItem 
                        icon={Activity} 
                        label="Dashboard" 
                        active={activeTab === 'dashboard'} 
                        onClick={() => { setActiveTab('dashboard'); setIsMobileMenuOpen(false); }}
                      />
                      <SidebarItem 
                        icon={Shield} 
                        label="Administración" 
                        active={activeTab === 'admin'} 
                        onClick={() => { setActiveTab('admin'); setIsMobileMenuOpen(false); }}
                      />
                    </nav>

                    <div className="pt-6 border-t border-slate-800">
                      <button 
                        onClick={() => setIsLoggedIn(false)}
                        className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-rose-500/10 hover:text-rose-400 transition-all group"
                      >
                        <LogOut size={20} className="group-hover:text-rose-400" />
                        <span className="font-medium">Cerrar Sesión</span>
                      </button>
                    </div>
                  </div>
                </aside>

                {/* Main Content */}
                <main className="flex-1 min-w-0">
                  <AnimatePresence mode="wait">
                    <motion.div
                      key={activeTab}
                      initial={{ opacity: 0, y: 10 }}
                      animate={{ opacity: 1, y: 0 }}
                      exit={{ opacity: 0, y: -10 }}
                      transition={{ duration: 0.3 }}
                    >
                      {activeTab === 'dashboard' && <DashboardScreen />}
                      {activeTab === 'admin' && <AdminPanel />}
                    </motion.div>
                  </AnimatePresence>
                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
