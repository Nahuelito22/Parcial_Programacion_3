        // ═══════════════════════════════════════════

        const useCountUp = (target, duration = 1200) => {
            const [count, setCount] = useState(0);
            useEffect(() => {
                let start = 0; const step = target / (duration / 16);
                const timer = setInterval(() => {
                    start += step;
                    if (start >= target) { setCount(target); clearInterval(timer); }
                    else setCount(Math.floor(start));
                }, 16);
                return () => clearInterval(timer);
            }, [target, duration]);
            return count;
        };

                </div>
            );
        };

        // ═══════════════════════════════════════════
        // COMPONENTE: CONFIRMACIÓN DE ELIMINACIÓN
        // ═══════════════════════════════════════════

        const DeleteConfirm = ({ player, onConfirm, onCancel }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center">
                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onCancel} />
                <div className="relative bg-surface-dark border border-white/[0.08] rounded-2xl p-6 max-w-sm w-full mx-4 animate-fade-in shadow-2xl">
                    <div className="w-12 h-12 rounded-full bg-red-500/10 flex items-center justify-center mx-auto mb-4">
                        <Icon name="trash" size={22} className="text-red-400" />
                    </div>
                    <h3 className="font-display text-lg font-bold text-center mb-2">Eliminar Jugador</h3>
                    <p className="text-sm text-gray-400 text-center mb-6">
                        ¿Estás seguro de que deseas eliminar a <span className="text-gray-200 font-medium">{player.name}</span>? Esta acción no se puede deshacer.
                    </p>
                    <div className="flex gap-3">
                        <button onClick={onCancel} className="flex-1 py-2.5 rounded-xl text-sm font-medium text-gray-400 bg-white/[0.04] hover:bg-white/[0.08] transition-colors border border-white/[0.06]">Cancelar</button>
                        <button onClick={onConfirm} className="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-red-500 hover:bg-red-400 text-white transition-colors">Eliminar</button>
                    </div>
                </div>
            </div>
        );

        // ═══════════════════════════════════════════
        // PÁGINA: PANEL ADMINISTRATIVO
        // ═══════════════════════════════════════════

        const AdminPage = () => {
            const [players, setPlayers] = useState(INITIAL_PLAYERS);
            const [editingPlayer, setEditingPlayer] = useState(null);
            const [deletingPlayer, setDeletingPlayer] = useState(null);
            const [search, setSearch] = useState('');
            const [toast, setToast] = useState(null);

            const filtered = players.filter(p =>
                p.name.toLowerCase().includes(search.toLowerCase()) ||
                p.country.toLowerCase().includes(search.toLowerCase())
            );

            const posClass = (pos) => {
                const map = { DEL: 'pos-del', MED: 'pos-med', DEF: 'pos-def', POR: 'pos-por' };
                return map[pos] || 'pos-del';
            };

            const handleSave = (updated) => {
                setPlayers(prev => prev.map(p => p.id === updated.id ? updated : p));
                setEditingPlayer(null);
                setToast({ message: `${updated.name} actualizado correctamente`, type: 'success' });
            };

            const handleDelete = () => {
                const name = deletingPlayer.name;
                setPlayers(prev => prev.filter(p => p.id !== deletingPlayer.id));
                setDeletingPlayer(null);
                setToast({ message: `${name} eliminado del registro`, type: 'error' });
            };

            return (
                <div className="p-8 max-w-[1400px]">
                    {/* Header */}
                    <div className="flex items-center justify-between mb-6">
                        <div>
                            <h2 className="font-display text-2xl font-bold tracking-tight text-gray-100">Gestión de Jugadores</h2>
                            <p className="text-sm text-gray-500 mt-0.5">{players.length} registros en la base de datos</p>
                        </div>
                        <button className="flex items-center gap-2 bg-brand hover:bg-brand-light text-surface-darker font-semibold px-5 py-2.5 rounded-xl text-sm transition-colors active:scale-[0.97]">
                            <Icon name="plus" size={16} />
                            Añadir Jugador
                        </button>
                    </div>

                    {/* Barra de búsqueda y filtros */}
                    <div className="flex items-center gap-3 mb-5">
                        <div className="relative flex-1 max-w-sm">
                            <Icon name="search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-600" />
                            <input type="text" value={search} onChange={e => setSearch(e.target.value)}
                                placeholder="Buscar por nombre o país..."
                                className="w-full bg-surface border border-white/[0.06] rounded-xl pl-10 pr-4 py-2.5 text-sm text-gray-200 placeholder-gray-600 input-focus transition-all" />
                        </div>
                        <div className="flex items-center gap-2">
                            {['Todos', 'DEL', 'MED', 'DEF', 'POR'].map((f, i) => (
                                <button key={f} className={`px-3 py-2 rounded-lg text-xs font-medium transition-colors ${
                                    i === 0 ? 'bg-brand/15 text-brand border border-brand/20' : 'text-gray-500 hover:text-gray-300 hover:bg-white/[0.04] border border-transparent'
                                }`}>{f}</button>
                            ))}
                        </div>
                    </div>

                    {/* Tabla */}
                    <div className="bg-surface/60 border border-white/[0.04] rounded-2xl overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead>
                                    <tr className="border-b border-white/[0.04]">
                                        {['Jugador', 'País', 'Posición', 'Goles', 'Asistencias', 'Acciones'].map(h => (
                                            <th key={h} className="text-left px-6 py-4 text-[11px] uppercase tracking-[0.15em] text-gray-500 font-semibold">{h}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.map(p => (
                                        <tr key={p.id} className="border-b border-white/[0.03] last:border-0 hover:bg-white/[0.02] transition-colors group">
                                            <td className="px-6 py-4">
                                                <div className="flex items-center gap-3">
                                                    <img src={p.img} alt="" className="w-10 h-10 rounded-full object-cover ring-1 ring-white/[0.08]" />
                                                    <span className="text-sm font-medium text-gray-200">{p.name}</span>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4">
                                                <span className="text-sm text-gray-400">{p.flag} {p.country}</span>
                                            </td>
                                            <td className="px-6 py-4">
                                                <span className={`inline-block px-2.5 py-0.5 rounded-md text-xs font-display font-semibold ${posClass(p.position)}`}>
                                                    {p.position}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4">
                                                <span className="font-display font-bold text-sm text-gray-200">{p.goals}</span>
                                            </td>
                                            <td className="px-6 py-4">
                                                <span className="font-display font-bold text-sm text-gray-200">{p.assists}</span>
                                            </td>
                                            <td className="px-6 py-4">
                                                <div className="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={() => setEditingPlayer(p)}
                                                        className="p-2 rounded-lg hover:bg-brand/10 text-gray-500 hover:text-brand transition-colors" title="Editar">
                                                        <Icon name="edit" size={16} />
                                                    </button>
                                                    <button onClick={() => setDeletingPlayer(p)}
                                                        className="p-2 rounded-lg hover:bg-red-500/10 text-gray-500 hover:text-red-400 transition-colors" title="Eliminar">
                                                        <Icon name="trash" size={16} />
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                    {filtered.length === 0 && (
                                        <tr>
                                            <td colSpan={6} className="px-6 py-12 text-center text-gray-500 text-sm">
                                                No se encontraron jugadores con ese criterio de búsqueda.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Paginación simulada */}
                    <div className="flex items-center justify-between mt-4 text-sm text-gray-500">
                        <span>Mostrando {filtered.length} de {players.length} jugadores</span>
                        <div className="flex items-center gap-1">
                            {[1, 2, 3].map(n => (
                                <button key={n} className={`w-8 h-8 rounded-lg text-xs font-medium transition-colors ${
                                    n === 1 ? 'bg-brand/15 text-brand' : 'hover:bg-white/[0.04] text-gray-500'
                                }`}>{n}</button>
                            ))}
                        </div>
                    </div>

                    {/* Modales */}
                    {editingPlayer && <EditModal player={editingPlayer} onClose={() => setEditingPlayer(null)} onSave={handleSave} />}
                    {deletingPlayer && <DeleteConfirm player={deletingPlayer} onConfirm={handleDelete} onCancel={() => setDeletingPlayer(null)} />}
                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}
                </div>
            );
        };

        // ═══════════════════════════════════════════
        // APP PRINCIPAL
        // ═══════════════════════════════════════════

        const App = () => {
            const [page, setPage] = useState('login');

            const handleLogin = () => setPage('dashboard');
            const handleLogout = () => setPage('login');

            if (page === 'login') return <LoginPage onLogin={handleLogin} />;

            const titles = {
                dashboard: { title: 'Panel Principal', subtitle: 'Resumen de estadísticas del Mundial de Fútbol' },
                admin: { title: 'Administración', subtitle: 'Gestión de jugadores y estadísticas' },
            };

            return (
                <div className="flex min-h-screen bg-surface-dark">
                    <Sidebar activePage={page} onNavigate={setPage} onLogout={handleLogout} />
                    <div className="flex-1 flex flex-col min-w-0">
                        <Topbar {...titles[page]} />
                        <main className="flex-1 overflow-y-auto">
                            {page === 'dashboard' && <DashboardPage />}
                            {page === 'admin' && <AdminPage />}
                        </main>
                    </div>
                </div>
            );
        };

        // ═══════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
