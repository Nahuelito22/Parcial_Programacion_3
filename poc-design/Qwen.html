/* ============================================================
   LUCIDE ICON WRAPPER
============================================================ */
const Icon = ({ name, size = 20, className = "", strokeWidth = 2 }) => {
  const ref = React.useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const svg = window.lucide.createElement(window.lucide.icons[toPascal(name)]);
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
      svg.setAttribute("stroke-width", strokeWidth);
      svg.setAttribute("class", className);
      ref.current.appendChild(svg);
    }
  }, [name, size, className, strokeWidth]);
  return <span ref={ref} className="inline-flex" />;
};
const toPascal = (s) => s.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join('');

          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center">
              <Icon name="trophy" size={18} className="text-slate-950"/>
            </div>
            <div className="font-display font-bold text-white">WorldCup<span className="text-emerald-400">Stats</span></div>
          </div>
          <button onClick={() => setAuthed(false)} className="w-9 h-9 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-slate-400">
            <Icon name="log-out" size={16}/>
          </button>
        </div>
        {/* Mobile nav */}
        <div className="lg:hidden flex gap-2 mb-6 overflow-x-auto scrollbar-hide">
          {[
            { id: "dashboard", label: "Dashboard", icon: "layout-dashboard" },
            { id: "players", label: "Jugadores", icon: "users" },
            { id: "admin", label: "Admin", icon: "settings" },
          ].map(item => (
            <button key={item.id} onClick={() => setView(item.id)}
              className={`flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap ${view===item.id ? "bg-emerald-500 text-slate-950" : "bg-white/5 text-slate-400 border border-white/10"}`}>
              <Icon name={item.icon} size={14}/>
              {item.label}
            </button>
          ))}
        </div>

        {view === "dashboard" && <DashboardView/>}
        {view === "players" && <PlayersView/>}
        {view === "admin" && <AdminView/>}
        {view === "matches" && <PlaceholderView title="Partidos" subtitle="Historial y calendario de encuentros" icon="flag"/>}
        {view === "teams" && <PlaceholderView title="Selecciones" subtitle="Fichas técnicas de las selecciones" icon="shield"/>}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
